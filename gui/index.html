<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
<style>
	:root{
		--box-shadow-small: 0 0 5px rgba(0, 0, 0, 0.3);
		--box-shadow-middle: 0 0 10px rgba(0, 0, 0, 0.5);
		--box-shadow-large: 0 0 15px rgba(0, 0, 0, 0.7);
		--color-hover: #f0f0ff;
		--border-small: solid 1px black;
		--border-middle: solid 2px black;
	}
	*{
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		line-height: 1;
	}
	button{
		padding: 5px 10px;
		background-color: transparent;
		border: var(--border-small);
		cursor: pointer;

		&.btn-new{
			width: 100%;
			height: 50px;
			margin: 5px 0;
		}
	}
	input{
		border: var(--border-small)
	}
	dialog{
		margin: auto;
		padding: 20px;
		border: var(--border-middle);

		#action{
			text-align: right;
		}
	}
</style>
	<script type="module" src="main.js"></script>
</head>
<body style="position: relative;"><app-main id="appmain">

</app-main></body>
</html>
