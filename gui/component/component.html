<template id="not-slotted">
	<slot>未插入内容</slot>
<style>
:host{
	width: 100%; height: 100%;
	text-align: center;
	color: #666;
}
</style>
</template>

<template id="agent-default">
	<img src="../resource/avatar.jpg" alt="头像">
	<div id="detail">
		<span id="source">source</span>
	</div>
<style>
	:host{
		display: inline-block;
		--detail-display: none;
		&:host(:hover){
			--detail-display: block;
		}
		img{
			height: 100%;
		}

		#detail{
			display: var(--detail-display);
		}
	}
</style>
</template>

<template id="group-default">
	<section id="list-message">
		<div class="message">
			<div class="message-content">这里是消息内容</div>
			<agent-default class="message-sender"></agent-default>
		</div>
	</section>
	<section id="list-member">
		<dialog id="member-new"><form method="dialog">
			<label>name <input type="text" name="name"></label>
			<label>system_message <input type="text" name="system_message"></label>
			<div id="action">
				<button value="Y" type="submit">创建</button>
				<button value="N">取消</button>
			</div>
		</form></dialog>
		<button class="btn-new">添加成员</button>
		<div class="member">
			<agent-default class="member-avatar"></agent-default>
			<span class="member-name"></span>
		</div>
	</section>
	<box-chat></box-chat>
<style>
	:host{
		display: flex;
		box-chat{
			position: fixed;
			bottom: 10vh;
			left: 20%; right: 20%;
		}
		dialog{
			margin: auto;
		}
		#list-member{
			flex-basis: 20%;
			flex-grow: 0;
			position: sticky; top: 0px;
			align-self: start;
		}
		#list-message{
			flex-basis: 80%;
			flex-grow: 1;
			padding: 0 10%;
		}
	}

	.member{
		border: var(--border-small);
		padding: 5px;
		height: 50px;
		
		agent-default.member-avatar{
			display: inline-block;
			height: 100%;
		}
	}

	.message{
		position: relative;
		justify-self: left;
		width: fit-content;
		min-height: 50px;

		padding: 10px;
		margin: 10px 0;
		border: var(--border-small);
		
		agent-default.message-sender{
			position: absolute;
			top: 0px;
			right: 102%;
			height: 100%;
			max-height: 50px;
		}

		&.message.message-user{
			justify-self: right;
			agent-default.message-sender{
				left: 102%;
			}
		}
		&.message.message-multi{
			padding: 10px;
			.message-content{
				display: block;
				padding: 5px;
				border: var(--border-small);
			}
		}
	}
</style>
</template>

<template id="box-chat">
	<form>
		<textarea name="content"></textarea>
		<input name="file" type="file">
		<button type="submit">发送</button>
	</form>
<style>
	:host{
		border: var(--border-middle);
		padding: 5px !important;

		textarea{
			width: 100%;
			resize: none;
		}
	}
</style>
</template>

<template id="app-main">
	<section id="list-group">
		<dialog id="group-new"><form method="dialog">
			<label>name <input type="text" name="name"></label>
			<label>max_member <input type="text" name="max_member"></label>
			<div id="action">
				<button value="Y" type="submit">创建</button>
				<button value="N">取消</button>
			</div>
		</form></dialog>
		<button class="btn-new">添加群聊</button>
		<div class="group">
			<div class="group-avatar"></div>
			<span class="group-name"></span>
		</div>
	</section>
	<group-default id="el-group"></group-default>
<style>
	:host{
		display: flex;
		padding: 0 5px !important;
		&fold{
			display: none;
		}

		#btn-fold{
			position: absolute;
			top: 0px;
			left: 0px;
		}
		group-default{
			flex-basis: 90%; flex-grow: 1;
		}
		#list-group{
			flex-basis: 10%;
			position: sticky; top: 0px;
			align-self: start;
		}
	}
	.group{
		border: var(--border-small);
		padding: 5px;
		height: 50px;

		*{
			pointer-events: none;
		}

		&.group.selected{
			border: var(--border-middle);
			border-color: red;
		}
	}
</style>
</template>
