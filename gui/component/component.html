<template id="not-slotted">
	<slot>未插入内容</slot>
<style>
:host{
	width: 100%; height: 100%;
	text-align: center;
	color: white; background-color: red;
}
</style>
</template>

<template id="agent-default">
	<img src="../resource/avatar.jpg" alt="头像">
	<div id="detail">
		<span id="source">source</span>
	</div>
<style>
	:host{
		display: inline-block;
		--detail-display: none;
		&:host(:hover){
			--detail-display: block;
		}
		img{
			height: 100%;
		}
		#detail{
			display: var(--detail-display);
		}
	}
</style>
</template>

<template id="group-default">
	<section id="bar">
		<span id="group-name">group name</span>
		<button popovertarget="detail">|||</button>
	</section>
	<dialog id="detail" popover>
		<label>version: <span></span></label>
		<label>name: <span></span></label>
		<label id="label-list-member">members: <span></span>
			<section id="list-member">
				<dialog id="member-new" popover><form method="dialog">
					<label>name <input type="text" name="name"></label>
					<label>system_message <input type="text" name="system_message"></label>
					<div id="action">
						<button value="Y" type="submit">创建</button>
						<button value="N">取消</button>
					</div>
				</form></dialog>
				<button class="btn-new" popovertarget="member-new">添加成员</button>
				<div class="member">
					<agent-default class="member-avatar"></agent-default>
					<span class="member-name"></span>
				</div>
			</section>
			<button class="fold-trigger"></button>
		</label>
	</dialog>
	<section id="list-message">
		<div class="message message-that">
			<agent-default class="message-sender"></agent-default>
			<div class="message-content">这里是消息内容</div>
		</div>
	</section>
	<box-chat></box-chat>
<style>
	:host{
		display: flex;
		flex-wrap: wrap;
		align-content: start;
		box-chat{
			position: fixed;
			bottom: 10vh;
			left: 20%; right: 20%;
		}
		#bar{
			flex-basis: 100%;
			position: sticky; top: 0px;
			padding: 5px;
			border-bottom: var(--border-middle);
			z-index: 1;
		}
		#list-message{
			flex-basis: 80%;
			flex-grow: 1;
			padding: 0 10%;
		}
	}

	.message{
		position: relative;
		justify-self: left;
		width: fit-content;
		min-height: 50px;
		padding: 10px;
		margin: 10px 0;
		border: var(--border-small);
		
		.message-content{
			border: none;
			padding: 0px;
		}
		agent-default.message-sender{
			position: absolute;
			top: 0px;
			height: 100%;
			max-height: 48px;
		}
		&.message.message-this{
			justify-self: right;
			agent-default.message-sender{
				right: -50px;
			}
		}
		&.message.message-that{
			justify-self: left;
			agent-default.message-sender{
				left: -50px;
			}
		}
		&.message.message-multi{
			.message-content{
				padding: 5px;
				border: var(--border-small);
			}
		}
	}

	#detail{
		label{
			display: block;
			margin: 5px 0;
			padding: 5px;
			border: var(--border-small);
		}
		
		#label-list-member{
			position: relative;
			.fold-trigger{
				position: absolute;
				top: 0px; right: 0px;
				&::before{
					content: "▲";
				}
			}
			&#label-list-member.fold{
				*:not(.fold-trigger){
					display: none;
				}
				.fold-trigger{
					&::before{
						content: "▼";
					}
				}
			}
		}

		.member{
			border: var(--border-small);
			padding: 5px;
			height: 50px;
			
			agent-default.member-avatar{
				display: inline-block;
				height: 100%;
			}
		}
	}
</style>
</template>

<template id="box-chat">
	<form>
		<textarea name="content"></textarea>
		<label><input name="file" type="file" style="display: none;"><button type="button" style="pointer-events: none;">文件</button></label>
		<button>发送</button>
	</form>
<style>
	:host{
		border: var(--border-middle);
		padding: 5px !important;

		textarea{
			display: block;
			width: 100%;
			resize: none;
			border-radius: 0;
		}
	}
</style>
</template>

<template id="app-main">
	<section id="list-group">
		<dialog id="group-new"><form method="dialog">
			<label>name <input type="text" name="name"></label>
			<label>max_member <input type="text" name="max_member"></label>
			<div id="action">
				<button value="Y" type="submit">创建</button>
				<button value="N">取消</button>
			</div>
		</form></dialog>
		<button class="btn-new">添加群聊</button>
		<div class="group">
			<div class="group-avatar"></div>
			<span class="group-name"></span>
		</div>
		<button class="fold-trigger"></button>
	</section>
	<group-default id="el-group"></group-default>
<style>
	:host{
		display: flex;
		padding: 0 5px !important;
		group-default{
			flex-basis: 90%; flex-grow: 1;
		}
		#list-group{
			flex-basis: 10%;
			position: sticky; top: 0px;
			.fold-trigger{
				position: absolute;
				top: 50vh; left: 0px;
				&::before{
					content: "◀";
				}
			}

			&#list-group.fold{
				flex-basis: 0;
				*:not(.fold-trigger){
					display: none;
				}
				.fold-trigger{
					&::before{
						content: "▶";
					}
				}
			}
		}
	}
	.group{
		border: var(--border-small);
		padding: 5px;
		height: 50px;

		*{
			pointer-events: none;
		}

		&.group.selected{
			border: var(--border-middle);
			border-color: red;
		}
	}
</style>
</template>
